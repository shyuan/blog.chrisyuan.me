name: CI

permissions:
  contents: read

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

jobs:
  lint:
    name: Code standards
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v6

      - name: "📦 Setup bun"
        uses: oven-sh/setup-bun@v2

      - name: "📦 Install dependencies"
        run: bun install

      - name: "📝 AutoCorrect (CJK spacing)"
        uses: huacnlee/autocorrect-action@v2
        with:
          args: "src/data/blog/ --lint --no-diff-bg-color"

      - name: "🔎 Lint code"
        run: bun run lint

      - name: "📝 Checking code format"
        run: bun run format:check

      - name: "🧪 Run tests"
        run: bun test

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v6

      - name: "⬢ Setup Node.js"
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: "📦 Setup bun"
        uses: oven-sh/setup-bun@v2

      - name: "📦 Install dependencies"
        run: bun install

      - name: "🚀 Build the project"
        run: bun run build
