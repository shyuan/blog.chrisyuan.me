name: IndexNow

permissions:
  contents: read

on:
  # Submit recently-updated URLs once a day (09:00 UTC = 17:00 台灣時間).
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  submit:
    name: Submit URLs to IndexNow
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "📡 Notify IndexNow"
        uses: bojieyang/indexnow-action@v3
        with:
          sitemap-location: "https://blog.chrisyuan.me/sitemap-index.xml"
          # IndexNow key 本身即為公開資訊（驗證檔 public/5f8ac260f0b943d2b05520fe1044b4ef.txt
          # 可被任何人訪問），故直接內嵌而非使用 Secret。
          key: "5f8ac260f0b943d2b05520fe1044b4ef"
          # 提交至 IndexNow 通用端點，一次通知所有參與的搜尋引擎
          # （Bing、Yandex、Seznam、Naver 等），key 為跨引擎共用。
          endpoint: api.indexnow.org
          # 每日排程，回看 2 天作為重疊緩衝，避免 cron 漂移漏掉剛發布的文章
          # （IndexNow 重複提交相同 URL 為冪等操作，不會有副作用）。
          since: 2
          since-unit: day
