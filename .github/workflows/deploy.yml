name: Deploy to Cloudflare Pages

permissions:
  contents: read
  deployments: write

on:
  push:
    branches:
      - main
  # Hourly rebuild to publish scheduled posts (paired with
  # SITE.scheduledPostMargin = 65 minutes in src/config.ts).
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  lint:
    name: Code standards
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v6

      - name: "📦 Setup bun"
        uses: oven-sh/setup-bun@v2

      - name: "📦 Install dependencies"
        run: bun install

      - name: "📝 AutoCorrect (CJK spacing)"
        uses: huacnlee/autocorrect-action@v2
        with:
          args: "src/data/blog/ --lint --no-diff-bg-color"

      - name: "🔎 Lint code"
        run: bun run lint

      - name: "📝 Checking code format"
        run: bun run format:check

  deploy:
    name: Build & Deploy
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v6

      - name: "⬢ Setup Node.js"
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: "📦 Setup bun"
        uses: oven-sh/setup-bun@v2

      - name: "📦 Install dependencies"
        run: bun install

      - name: "🚀 Build the project"
        run: bun run build
        env:
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}

      - name: "☁️ Deploy to Cloudflare Pages"
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=blog-chrisyuan-me --commit-dirty=true --commit-message="${{ github.sha }}"

  indexnow:
    name: Notify IndexNow
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 等 Cloudflare 邊緣節點完成新部署的傳播，確保 IndexNow 抓到的是
      # 更新後的 sitemap（含本次發布的文章）。
      - name: "⏳ Wait for Cloudflare edge propagation"
        run: sleep 30

      - name: "📡 Notify IndexNow"
        # SHA-pinned to v3.0.0 (38ddfbd) — mitigates floating-tag supply-chain risk.
        uses: bojieyang/indexnow-action@38ddfbd93579a8a44c0dee662121bf9d51098f71 # v3.0.0
        with:
          sitemap-location: "https://blog.chrisyuan.me/sitemap-index.xml"
          # IndexNow key 本即公開（驗證檔 public/5f8ac…txt 任何人可訪問），故直接內嵌。
          key: "5f8ac260f0b943d2b05520fe1044b4ef"
          # 通用端點，一次通知所有參與的搜尋引擎（Bing、Yandex、Seznam、Naver…）。
          endpoint: api.indexnow.org
          # 回看 2 天涵蓋本次發布及排程文章；重複提交為冪等操作，無副作用。
          since: 2
          since-unit: day
