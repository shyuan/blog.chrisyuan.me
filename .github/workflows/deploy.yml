name: Deploy to Cloudflare Pages

permissions:
  contents: read
  deployments: write

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Code standards
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v6

      - name: "📦 Setup bun"
        uses: oven-sh/setup-bun@v2

      - name: "📦 Install dependencies"
        run: bun install

      - name: "📝 AutoCorrect (CJK spacing)"
        uses: huacnlee/autocorrect-action@v2
        with:
          args: "src/data/blog/ --lint --no-diff-bg-color"

      - name: "🔎 Lint code"
        run: bun run lint

      - name: "📝 Checking code format"
        run: bun run format:check

  deploy:
    name: Build & Deploy
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v6

      - name: "⬢ Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "📦 Setup bun"
        uses: oven-sh/setup-bun@v2

      - name: "📦 Install dependencies"
        run: bun install

      - name: "🚀 Build the project"
        run: bun run build
        env:
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}

      - name: "☁️ Deploy to Cloudflare Pages"
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=blog-chrisyuan-me --commit-dirty=true
